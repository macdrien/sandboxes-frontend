<!DOCTYPE html>
<html lang="en">
<head>
    <title>Date picker</title>
    <meta charset="UTF-8">
    <link href="./style.css" rel="stylesheet">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
</head>
<body>
<h1>Date picker</h1>
<div class="main">
    <form>
        <label for="day">
            Day
            <input id="day" name="day" type="text"/>
        </label>
        <label for="month">
            Month
            <input id="month" name="day" type="text"/>
        </label>
        <label for="year">
            Year
            <input id="year" name="day" type="text"/>
        </label>
    </form>
</div>

<script src="./script.js" type="module"></script>
</body>
</html>
